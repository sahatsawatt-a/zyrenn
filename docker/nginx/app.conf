# ONE ORIGIN. Everything the browser needs is reachable through this single port,
# because a tunnel (ngrok) publishes exactly one, and over https a ws:// on a
# second port is blocked outright as mixed content. Keeping the socket on the
# same origin means it rides the same :443 as the page and needs no extra rule
# on the LAN port-proxy either.

# This nginx is itself behind Traefik or a tunnel, so the forwarded headers
# already describe the host the user actually typed. Pass them through
# untouched, and fall back to this hop's own values when the app is hit
# directly by IP:PORT.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
map $http_x_forwarded_host $fwd_host {
    default $http_x_forwarded_host;
    ''      $http_host;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Inertia payloads and asset bundles are both larger than the default.
    client_max_body_size 100m;

    # --- websockets -----------------------------------------------------------
    # `web` depends on `reverb` so nginx cannot boot first and refuse with
    # `host not found in upstream "reverb"`.
    # These come before `location /`, which would otherwise swallow them.
    location /app/ {
        proxy_pass http://reverb:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The collaboration server: shared notes and boards, over a websocket.
    # Looked up per request, like vite below, so nginx still starts without it.
    location ^~ /collab {
        set $collab_upstream http://collab:1234;
        proxy_pass $collab_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Reverb's HTTP API, used by the app to publish events.
    location /apps/ {
        proxy_pass http://reverb:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
    }

    # --- the Vite dev server (dev profile only) -------------------------------
    # Dev assets and HMR ride this same origin, so the HTML never names a
    # dev-server address: the https hostname, localhost and a phone on the LAN
    # each load them from whatever they arrived on. vite.config.ts writes an
    # empty public/hot to make Laravel emit these relative URLs.
    #
    # `resolver` + a variable in proxy_pass so the name is looked up per request
    # rather than at boot: without COMPOSE_PROFILES=dev there is no `vite`
    # container, and a literal upstream would stop nginx starting at all. These
    # paths simply go unused once the built assets in public/build are served.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /@vite/, /@id/, /@fs/, /@vite-plus/ ... every dev-only virtual path
    location ^~ /@ {
        set $vite_upstream http://vite:5173;
        proxy_pass $vite_upstream;
        proxy_set_header Host $http_host;
    }

    location ^~ /resources/ {
        set $vite_upstream http://vite:5173;
        proxy_pass $vite_upstream;
        proxy_set_header Host $http_host;
    }

    location ^~ /node_modules/ {
        set $vite_upstream http://vite:5173;
        proxy_pass $vite_upstream;
        proxy_set_header Host $http_host;
    }

    # The HMR socket, on the path set by server.ws.path
    location = /vite-hmr {
        set $vite_upstream http://vite:5173;
        proxy_pass $vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- the app --------------------------------------------------------------
    location / {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;

        # AddLinkHeadersForPreloadedAssets emits ONE Link: header naming every
        # preloaded asset -- 2.7KB on a login page already, and it grows with
        # the bundle. nginx must fit an upstream's whole header into a single
        # proxy_buffer_size buffer, and the default 4k is not enough: every
        # page answers 502 the moment the app serves built assets instead of
        # the Vite dev server, which is the configuration you would deploy.
        # The dev server hides this until you turn it off.
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host $fwd_host;
        proxy_buffering off;
    }
}
