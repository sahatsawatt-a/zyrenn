# What the tunnel lets through (docker-compose.yml, `tunnel`): workflow hooks
# only. Telegram, LINE and webhooks reach /hooks/*, where each hook checks its
# sender's own signature; anything else of the app is answered here, at
# ngrok's edge, and never reaches it.
on_http_request:
    - expressions:
          - "!req.url.path.startsWith('/hooks/')"
      actions:
          - type: custom-response
            config:
                status_code: 404
                content: Not found
