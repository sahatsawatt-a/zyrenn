# A minimal Traefik for one machine, with free HTTPS certificates from Let's
# Encrypt. Only needed if this machine does not already run Traefik. Start it
# once, from this folder; ZyrenN's overlay then joins its `traefik` network.
#
#   cp .env.example .env     # set ACME_EMAIL, and see docs/SETUP.md
#   docker network create traefik
#   docker compose up -d
#
# Needs ports 80 and 443 reachable from the internet, and the hostname's DNS
# pointing at this machine. For a LAN-only name see "Local HTTPS" in docs/SETUP.md.
services:
    traefik:
        image: traefik:v3.1
        restart: unless-stopped
        command:
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --entrypoints.web.address=:80
            - --entrypoints.web.http.redirections.entrypoint.to=websecure
            - --entrypoints.web.http.redirections.entrypoint.scheme=https
            - --entrypoints.websecure.address=:443
            # Every router that says tls=true gets a certificate from here
            - --entrypoints.websecure.http.tls.certresolver=le
            - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL}
            - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
            - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
            - letsencrypt:/letsencrypt
        networks: [traefik]

volumes:
    letsencrypt:

networks:
    traefik:
        external: true
