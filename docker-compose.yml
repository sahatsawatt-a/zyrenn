# Base stack. Works on any machine with Docker: no reverse proxy, no external
# networks. Ports are published directly and every host-specific value is an
# override with a sane default.
#
# Machines fronted by Traefik additionally load docker-compose.traefik.yml --
# see that file's header.
services:
    # Readies the checkout before `app` starts (docker/init.sh): .env and its
    # secrets, PHP and JS dependencies, the key, built assets, migrations. Each
    # step is skipped once done, so a fresh clone needs nothing but
    # `docker compose up -d`, and the next `up` after a pull catches up.
    # The first run takes a few minutes: `docker compose logs -f init`.
    init:
        image: zyrenn-app:local
        # Built by `app`, never pulled: otherwise compose first asks Docker Hub
        # for zyrenn-app:local on a machine that has not built it yet, and some
        # versions stop at the refusal before anything is built. The same goes
        # for `app` and every service below that shares the image.
        pull_policy: never
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        environment:
            # Whether Vite serves the assets or they are built
            COMPOSE_PROFILES: '${COMPOSE_PROFILES:-}'
        depends_on:
            postgres:
                condition: service_healthy
        command: bash docker/init.sh

    app:
        build:
            context: .
            args:
                UID: '${UID:-1000}'
                GID: '${GID:-1000}'
        image: zyrenn-app:local
        # Built here, never pulled (see init)
        pull_policy: never
        restart: unless-stopped
        volumes:
            - .:/var/www/html
            - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/zz-uploads.ini:ro
        # So a chat can reach an Ollama on this machine as host.docker.internal
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        # Deliberately unpublished: `web` is the single origin. See docker/nginx.
        expose:
            - '8000'
        depends_on:
            init:
                condition: service_completed_successfully
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'php -r "exit(@file_get_contents(''http://127.0.0.1:8000/up'') === false ? 1 : 0);"',
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 20s

    # The one origin. Fronts the app and the websocket, so a tunnel, a Traefik
    # route and the LAN address never have to change.
    web:
        image: nginx:1.27-alpine
        restart: unless-stopped
        volumes:
            - ./docker/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
        ports:
            - '${APP_PORT:-8001}:8080'
        depends_on:
            app:
                condition: service_healthy
            # nginx resolves upstreams at startup: without this it can boot
            # first and refuse with `host not found in upstream "reverb"`.
            reverb:
                condition: service_started

    # The websocket. Shares the app image because it IS the app -- reverb:start
    # boots the same Laravel and reads the same config and channel guards.
    #
    # Unpublished on purpose: the browser reaches it through `web`, on the one
    # origin, so wss rides the same :443 as the page. See docker/nginx.
    reverb:
        image: zyrenn-app:local
        pull_policy: never
        restart: unless-stopped
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        expose:
            - '8080'
        depends_on:
            app:
                condition: service_healthy
        command: php artisan reverb:start --host=0.0.0.0 --port=8080

    # Live co-editing of notes and boards (collab/server.mjs): a Yjs server
    # that passes every edit between the people who have one open, and loads
    # and stores each document through the app. Shares the app image for its
    # node and the bind-mounted node_modules.
    #
    # Unpublished like reverb: the browser reaches it through `web` at /collab.
    collab:
        image: zyrenn-app:local
        pull_policy: never
        restart: unless-stopped
        working_dir: /var/www/html
        init: true
        volumes:
            - .:/var/www/html
        expose:
            - '1234'
        environment:
            COLLAB_APP_URL: 'http://app:8000'
        depends_on:
            app:
                condition: service_healthy
        # COLLAB_SECRET comes from .env as the app reads it, not through compose:
        # on a fresh clone compose reads .env before init has written the secret.
        command: node --env-file-if-exists=.env collab/server.mjs

    # Dev-only. While this runs it writes public/hot and Laravel serves assets
    # from the Vite dev server, which is unreachable from outside this machine.
    # Left out unless COMPOSE_PROFILES=dev, so the default `up` serves the built
    # assets in public/build and is safe to expose over a tunnel or IP:PORT.
    #
    # Shares the app image because Vite plugins may invoke `php` at build time.
    vite:
        profiles: ['dev']
        image: zyrenn-app:local
        pull_policy: never
        restart: unless-stopped
        working_dir: /var/www/html
        # Real PID 1 for correct signal forwarding and zombie reaping -- helps,
        # but the trap below is what actually matters (see command).
        init: true
        depends_on:
            - app
        volumes:
            - .:/var/www/html
        environment:
            # The origin the browser uses to reach Vite. Passed through as-is,
            # including unset: `web` then proxies the dev server on the page's
            # own origin, which is the only way one page works from the
            # hostname, localhost and a LAN IP at once. An absolute URL here
            # sends the browser straight to the dev server instead.
            VITE_DEV_ORIGIN: '${VITE_DEV_ORIGIN:-}'
            # Vite answers 403 for a Host header it does not recognise, which
            # would be every named host in front of it. Bare IPs it allows on
            # its own, so only names need listing: the app's own hostname, the
            # one the dev server is routed at, and anything else (a tunnel)
            # named in VITE_ALLOWED_HOSTS as a comma-separated list.
            APP_HOST: '${APP_HOST:-}'
            VITE_HOST: '${VITE_HOST:-}'
            VITE_ALLOWED_HOSTS: '${VITE_ALLOWED_HOSTS:-}'
        # `npm run dev` puts npm at PID 1 with the real vite process a hop
        # downstream; a `docker compose stop`/`down` SIGTERM either never
        # reaches that far down or gets hard-killed on the way, so
        # laravel-vite-plugin's own exit/SIGTERM handlers -- which delete
        # public/hot -- never run, and the file goes stale. Rather than
        # depend on that cleanup path, delete it directly in a trap. ($$ is
        # Compose's escape for a literal $, so the shell sees $child / $!.)
        command: >
            sh -c '
                npm run dev &
                child=$$!
                trap "rm -f public/hot public/fonts-manifest.dev.json; kill -TERM $$child 2>/dev/null" TERM INT
                wait $$child
                rm -f public/hot public/fonts-manifest.dev.json
            '
        ports:
            - '${VITE_PORT:-5173}:5173'

    # The PDF printer: a headless Chrome that prints a note as the app draws it
    # (docker/chrome/server.mjs). The app hands it a URL on `web` and the user's
    # own session cookie, and gets the bytes back.
    #
    # The Playwright image ships the browsers but not the npm package, and ESM
    # ignores NODE_PATH, so the package is installed into /work with the server
    # copied beside it -- /srv is the read-only repo mount. A restart finds it
    # already there; only a recreate pays for the install again.
    #
    # No `ports`: something that takes a session cookie and fetches pages as
    # that user is not left listening on the LAN. `app` reaches it privately.
    chrome:
        image: mcr.microsoft.com/playwright:v1.61.0-noble
        restart: unless-stopped
        working_dir: /srv
        volumes:
            - ./docker/chrome:/srv:ro
        command: >
            bash -lc "mkdir -p /work && cd /work &&
                      { [ -d node_modules/playwright ] || npm i playwright@1.61.0 >/tmp/npm.log 2>&1 ||
                        { echo 'npm install failed:'; tail -20 /tmp/npm.log; exit 1; }; } &&
                      cp /srv/server.mjs /work/server.mjs && exec node /work/server.mjs"
        expose:
            - '3000'
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'node -e "fetch(''http://127.0.0.1:3000/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
                ]
            interval: 10s
            timeout: 5s
            retries: 6
            # The first boot installs playwright, then launches chromium
            start_period: 90s
        depends_on:
            - web

    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            # Read from the app's own .env, so the two can never drift apart.
            POSTGRES_DB: '${DB_DATABASE:-zyrenn}'
            POSTGRES_USER: '${DB_USERNAME:-zyrenn}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        ports:
            # Set FORWARD_DB_PORT in .env when 5432 is already taken on the host.
            - '${FORWARD_DB_PORT:-5434}:5432'
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U ${DB_USERNAME:-zyrenn} -d ${DB_DATABASE:-zyrenn}',
                ]
            interval: 5s
            timeout: 5s
            retries: 10

    # Backups of the database and the Drive's files together, with old ones
    # removed on a rotation (docker/backup/backup.sh). They land OUTSIDE the
    # repo, next to it by default: a backup inside the project is one
    # `git clean` or bind-mount accident away from going with it.
    #
    # The postgres image, so pg_dump matches the server's version. It runs as
    # the host user, so it can read storage/app/private and the files it writes
    # are yours. Take one now:
    #     docker compose exec backup /backup.sh once
    backup:
        image: postgres:17-alpine
        restart: unless-stopped
        user: '${UID:-1000}:${GID:-1000}'
        entrypoint: ['/backup.sh']
        environment:
            PGHOST: postgres
            PGDATABASE: '${DB_DATABASE:-zyrenn}'
            PGUSER: '${DB_USERNAME:-zyrenn}'
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            BACKUP_INTERVAL_HOURS: '${BACKUP_INTERVAL_HOURS:-6}'
            BACKUP_KEEP_DAYS: '${BACKUP_KEEP_DAYS:-14}'
            BACKUP_KEEP_MIN: '${BACKUP_KEEP_MIN:-3}'
        volumes:
            - ./docker/backup/backup.sh:/backup.sh:ro
            - ./storage/app/private:/storage/private:ro
            # Name backups in this machine's time, not UTC
            - /etc/localtime:/etc/localtime:ro
            - '${BACKUP_DIR:-../zyrenn-backups}:/backups'
        healthcheck:
            # Healthy while the newest backup is under two intervals old
            test:
                [
                    'CMD-SHELL',
                    'find /backups -maxdepth 1 -name "auto-*" -mmin -$$((BACKUP_INTERVAL_HOURS * 120)) | grep -q .',
                ]
            interval: 5m
            timeout: 10s
            start_period: 10m
        depends_on:
            postgres:
                condition: service_healthy

volumes:
    pgdata:
